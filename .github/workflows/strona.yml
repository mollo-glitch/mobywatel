# Buduje stronę projektu (strona/) z aplikacją z aplikacja/dist i publikuje ją na gałęzi gh-pages (GitHub Pages).
# Bez filmu w strona/film-web/ strona pokazuje komunikat „Film jest chwilowo niedostępny” i przejście do demonstracji.
name: Strona
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: strona
  cancel-in-progress: true
jobs:
  publikacja:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Zbuduj stronę
        run: |
          if [ -f strona/film-web/spinka-film-v8.mp4 ]; then node strona/build.mjs; else node strona/build.mjs --bez-filmu; fi
      - name: Opublikuj na gałęzi gh-pages
        run: |
          cd strona/public
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Strona z ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
